      #     shopt -s nullglob
      #     for pkg in .cr-release-packages/*; do
      #       if [ -z "${pkg:-}" ]; then
      #         break
      #       fi
      #       helm push "${pkg}" oci://ghcr.io/"${GITHUB_REPOSITORY_OWNER}"/charts > .digest
